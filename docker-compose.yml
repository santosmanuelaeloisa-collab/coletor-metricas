
services:
  coletor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coletor
    user: "0:0"
    environment:
      TOKEN: segredo123
      PORTA: "5000"
      DB_PATH: /dados/dados.db
    volumes:
      - metricas_dados:/dados
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - rede_metricas

  agente:
    image: python:3.12-slim
    container_name: agente
    working_dir: /app
    volumes:
      - ./agente:/app:ro
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python -u agente.py"
    environment:
      COLETOR_HOST: coletor
      COLETOR_PORT: "5000"
      TOKEN: segredo123
      INTERVALO: "5"
    depends_on:
      - coletor
    restart: unless-stopped
    networks:
      - rede_metricas

  agente2:
    image: python:3.12-slim
    container_name: agente2
    working_dir: /app
    volumes:
      - ./agente:/app:ro
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python -u agente.py"
    environment:
      SIMULAR_METRICAS: "true"
      COLETOR_HOST: coletor
      COLETOR_PORT: "5000"
      TOKEN: segredo123
      INTERVALO: "5"
    depends_on:
      - coletor
    restart: unless-stopped
    networks:
      - rede_metricas

  painel:
    build:
      context: ./painel
      dockerfile: Dockerfile
    image: painel:latest
    container_name: painel
    environment:
      DB: /dados/dados.db
    volumes:
      - metricas_dados:/dados:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  painel-poucos:
    image: painel:latest
    container_name: painel-poucos
    environment:
      DB: /dados/dados.db
    volumes:
      - metricas_dados:/dados:ro
    ports:
      - "8083:8080"
    depends_on:
      - painel
    restart: unless-stopped

volumes:
  metricas_dados:

networks:
  rede_metricas:
    driver: bridge
