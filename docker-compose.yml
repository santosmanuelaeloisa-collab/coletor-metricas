# docker-compose.yml - ambiente de teste do Agente (Pessoa 1)
# Sobe o servidor coletor (servidor.py) e 2 agentes numa rede propria com IPs fixos.
# As variaveis de ambiente (COLETOR_HOST, COLETOR_PORT, TOKEN) sao as mesmas
# que o agente.py le.

services:
  coletor:
    image: python:3.11-slim
    container_name: coletor
    working_dir: /app
    volumes:
      - ./servidor.py:/app/servidor.py:ro
      - ./dados:/app/dados
    environment:
      TOKEN: segredo123
      PORTA: "5000"
      DB_PATH: /app/dados/dados.db
    command: python servidor.py
    ports:
      - "5000:5000"
    networks:
      rede_metricas:
        ipv4_address: 172.20.0.10

  agente1:
    image: agente-metricas:latest
    container_name: agente1
    depends_on:
      - coletor
    environment:
      COLETOR_HOST: coletor
      COLETOR_PORT: "5000"
      TOKEN: segredo123
    restart: unless-stopped
    networks:
      rede_metricas:
        ipv4_address: 172.20.0.11

  agente2:
    image: agente-metricas:latest
    container_name: agente2
    depends_on:
      - coletor
    environment:
      COLETOR_HOST: coletor
      COLETOR_PORT: "5000"
      TOKEN: segredo123
    restart: unless-stopped
    networks:
      rede_metricas:
        ipv4_address: 172.20.0.12

networks:
  rede_metricas:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
